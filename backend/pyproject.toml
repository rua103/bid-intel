[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-intel-api"
version = "0.1.0"
description = "Government procurement notice extraction and relationship analytics"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "beautifulsoup4>=4.12,<5",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "pdfplumber>=0.11,<1",
  "Pillow>=11,<13",
  "pypdfium2>=4,<6",
  "xlrd>=2.0.1,<3",
  "olefile>=0.47,<1",
  "filelock>=3.16,<4",
  "py7zr>=1,<2",
  "rarfile>=4.2,<5",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1", "xlwt>=1.3,<2", "reportlab>=4,<5"]
graph = ["neo4j>=5.26,<6"]
ocr = ["rapidocr>=3,<4", "onnxruntime>=1.20,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
