[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bid-intel-api"
version = "0.1.0"
description = "Government procurement notice extraction and relationship analytics"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-multipart>=0.0.9,<1",
  "beautifulsoup4>=4.12,<5",
  "python-docx>=1.1,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<7",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
